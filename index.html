);background:#fff;color:var(--navy);border-radius:16px;padding:8px;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}.sc.on{background:#8FE3CF}.scr{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:10px 16px;font-size:clamp(16px,2.1vw,19px);line-height:1.6;max-height:240px;overflow:auto}.scr b{color:var(--coral)}.bub{border:0;border-radius:999px;padding:14px 22px;font-size:clamp(18px,2.6vw,24px);font-weight:700;color:var(--navy)}.bub.seen{outline:5px solid var(--teal)}.mid{align-self:center;background:var(--navy);color:var(--cream);border-radius:50%;width:130px;height:130px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}.ph{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:12px 18px}</style></head><body>

<script>
const N=a=>a.map(t=>({t}));
const SP=[['Space','Moon','#9FD8FF'],['Space','rocket','#FFB4A2'],['Space','Mars','#F5B700'],['Space','stars','#8FE3CF'],['Space','space suit','#9FD8FF'],['Space','helmet','#FFB4A2'],['Space','planet','#F5B700'],['Space','robot','#8FE3CF'],['Space','spaceship','#9FD8FF'],['Space','Moon train','#FFB4A2']];
const ST=['I was bored. ‘There’s nothing to do in the holidays,’ I said.','‘Ride your bike, Issa, or go to the park,’ said Mum.','‘But I want to do something exciting,’ I said.','‘We’re going to go on an exciting journey tomorrow,’ said Dad. ‘Go and pack your suitcase.’','The next morning we caught a train to the launch pad and got on the rocket. ‘Please take your seats. The flight leaves in ten minutes.’ There was a loud noise and suddenly we took off up into the sky. I looked out of my window and watched the Earth getting smaller and smaller.','‘Are we nearly there yet?’ asked my sister Aida. ‘No way! We arrive tomorrow!’ I said. ‘Take that pillow and go to sleep.’','The sky was dark now. There were thousands of stars. It was beautiful.','‘Wake up, Issa! We land in fifteen minutes,’ said Aida.','We got off the rocket and travelled by Moon train to the space hotel. Our bedroom had big windows in the roof. We could see Mars from the window!','It was fun for a few days floating around in the hotel and exploring the corridors, but there wasn’t much to do and the food wasn’t fresh.','One day, Aida said, ‘Can we play outdoors?’ ‘Well, not really,’ said Mum, ‘but there’s a Moon walk at three o’clock.’','The Moon walk was interesting, but it took a long time to put on the space suits and the helmets were uncomfortable. ‘When do we go back to Earth?’ I asked. ‘We leave in three days,’ said Mum. ‘Oh, good. When we get home, I’m going to ride my bike and go to the park,’ I said.'];
const PV=N(['get on','turn on','get off','put on','take off','turn off']);
const pv=(a,b,c)=>N([a,b,c]);
const A=[
{n:'1 · Space mind map',min:3,type:'mind'},
{n:'2 · Before you read',min:3,type:'mc',q:[
{pr:'Science fiction stories are usually set ___.',o:N(['in the future','in the past']),a:0},
{pr:'They are usually in a world that is ___ ours.',o:N(['the same as','different from']),a:1},
{pr:'Which story is science fiction?',o:N(['A girl rides her bike to school.','A family takes a rocket to the Moon.','A king lives in a castle in 1500.']),a:1},
{pr:'Where did they go on holiday?',o:N(['To the beach','To the mountains','To the Moon']),a:2},
{pr:'Where did they stay?',o:N(['In a tent','In a space hotel','In a school']),a:1}]},
{n:'3 · Listen and read',min:5,type:'story'},
{n:'4 · Who says it?',min:3,type:'mc',q:[
{pr:'“There’s nothing to do in the holidays.”',o:N(['Issa','Dad','Aida']),a:0},
{pr:'“We’re going to go on an exciting journey tomorrow.”',o:N(['Mum','Dad','Issa']),a:1},
{pr:'“Are we nearly there yet?”',o:N(['Aida','Mum','Dad']),a:0},
{pr:'“Wake up, Issa! We land in fifteen minutes.”',o:N(['Dad','Mum','Aida']),a:2},
{pr:'“Well, not really, but there’s a Moon walk at three o’clock.”',o:N(['Mum','Aida','Issa']),a:0},
{pr:'“When do we go back to Earth?”',o:N(['Aida','Issa','Dad']),a:1}]},
{n:'5 · Answer the questions',min:3,type:'mc',q:[
{pr:'What did Issa want at the beginning of the story?',o:N(['He wanted to do something exciting in the holidays.','He wanted to ride his bike.','He wanted to go to the park.']),a:0},

{pr:'Where does Issa want to go when he gets home?',o:N(['He wants to go to the Moon.','He wants to go to school.','He wants to go to the park.']),a:2}]},
{n:'6 · Phrasal verbs',min:3,type:'mc',q:[
{pr:'You go inside a bus or a train.',o:pv('get off','get on','take off'),a:1},
{pr:'You press the button to start the TV.',o:pv('turn on','turn off','put on'),a:0},

{pr:'You wear your jacket.',o:pv('put on','take off','turn on'),a:0},
{pr:'The plane leaves the ground.',o:pv('get on','take off','put on'),a:1},
{pr:'You press the button to stop the TV.',o:pv('turn on','get off','turn off'),a:2}]},
{n:'7 · on or off?',min:2,type:'mc',q:[
{pr:'I think we got ___ the wrong bus!',o:N(['on','off']),a:0},
{pr:'She tried to turn ___ the computer but it wasn’t working.',o:N(['on','off']),a:0},
{pr:'You have to get ___ at the next stop.',o:N(['on','off']),a:1},
{pr:'Please put ___ your seat belts.',o:N(['on','off']),a:0},
{pr:'The plane will take ___ in one hour.',o:N(['on','off']),a:1},
{pr:'Please turn ___ the TV.',o:N(['on','off']),a:1}]},
{n:'8 · Final task',min:3,type:'cloze'}];
const CL=7;
const C={t:'Issa was {0} (1) in the holidays. His dad said, “We’re going to go on an exciting journey.” The family caught a train to the launch pad and got {1} (2) the rocket. The rocket took {2} (3) into the sky. After a few days at the space hotel, they wanted to go home because the food wasn’t {3} (4). Issa is going to ride his {4} (5) when he gets home.',o:[['bored','tired','hungry'],['off','on','at'],['off','on','in'],['fresh','cold','hot'],['rocket','bike','pillow']],a:[0,1,0,0,1]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,seen:{},hl:null});
let S={step:0,st:A.map(nst)};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}

function line(i){S.st[2].hl=i;say(ST[i]);render()}
function play(){try{speechSynthesis.cancel();ST.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;u.onstart=()=>{S.st[2].hl=i;render()};speechSynthesis.speak(u)})}catch(e){}}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}

function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="q" style="text-align:center;font-size:56px;color:#E8553D">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next part →</button>':'')+'</div></div>';

 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div><div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+o.t+'</button>').join('')+'</div><div class="fb">'+(lk?(ok?'Great job! ':'Not quite. ')+'The answer is: '+q.o[q.a].t+'.':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
